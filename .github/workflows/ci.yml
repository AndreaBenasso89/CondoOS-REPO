name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy condominioos || true   # tighten to hard-fail as the codebase matures
      - name: Unit + contract tests
        run: pytest -q

  safety-gate:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # The release gate: the firewall red-team / QA eval suite MUST pass to deploy (docs/07 §9).
      - name: Reputation Firewall red-team suite
        run: python -m condominioos.evals.run_suite

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan / SAST / IaC scan
        run: echo "Wire gitleaks, semgrep, tfsec/checkov here (docs/06 §8)."
