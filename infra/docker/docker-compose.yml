# Local development stack for CondominioOS. `make up` boots this.
# EU-only data residency applies to staging/prod (k8s); this is local-only.
version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: condoos
      POSTGRES_PASSWORD: condoos
      POSTGRES_DB: condoos
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../services/condominioos/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro

  redis:
    image: redis:7
    ports: ["6379:6379"]

  nats:
    image: nats:2-alpine
    command: ["-js"]                 # enable JetStream
    ports: ["4222:4222", "8222:8222"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: condoos
      MINIO_ROOT_PASSWORD: condoospass
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=condoos
      - POSTGRES_PWD=condoos
      - POSTGRES_SEEDS=postgres
    depends_on: [postgres]
    ports: ["7233:7233"]

volumes:
  pgdata:
  miniodata:
  qdrantdata:
